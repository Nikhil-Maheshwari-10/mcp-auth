version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://workspace:workspace@postgres:5432/workspace_db
      POSTGRES_HOST: postgres
      NGROK_DOMAIN: ${NGROK_DOMAIN:-trailside-plentiful-humming.ngrok-free.dev}
      FRONTEND_URL: https://${NGROK_DOMAIN:-trailside-plentiful-humming.ngrok-free.dev}
    depends_on:
      postgres:
        condition: service_healthy

  adk:
    build:
      context: .
      dockerfile: adk_agent/Dockerfile
    container_name: adk
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["adk", "web", "adk_agent", "--host", "0.0.0.0", "--port", "8000", "--allow_origins", "*", "--session_service_uri", "postgresql+asyncpg://workspace:workspace@postgres:5432/workspace_db"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://workspace:workspace@postgres:5432/workspace_db
      NGROK_DOMAIN: ${NGROK_DOMAIN:-trailside-plentiful-humming.ngrok-free.dev}
      FRONTEND_URL: https://${NGROK_DOMAIN:-trailside-plentiful-humming.ngrok-free.dev}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
      - adk

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "frontend:80"
      - "--domain=${NGROK_DOMAIN}"
    depends_on:
      - frontend

volumes:
  postgres_data:
