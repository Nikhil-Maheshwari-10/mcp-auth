server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS resolver — re-resolves service names every 10s
    # This prevents 502s after api/adk container restarts (IP changes)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy: FastAPI Auth API — strip the /api prefix
    location /api/ {
        set $api_upstream http://api:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cookie_path / /;
    }

    # Reverse proxy: ADK agent API
    location /apps/ {
        set $adk_upstream http://adk:8000;
        proxy_pass $adk_upstream;  # no URI — passes full /apps/... path as-is
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /run_sse {
        set $adk_upstream http://adk:8000;
        proxy_pass $adk_upstream;  # no URI — passes /run_sse as-is
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
